<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floating hero, CSS only</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="hero">
    <!-- the floating pieces sit behind the text -->
    <ul class="floaters" aria-hidden="true">
      <li style="--x: 8%;  --y: 14%; --size: 92px;  --time: 8s; --delay: -1s; --drift: 16px;"><img src="assets/tomato.svg" alt=""></li>
      <li style="--x: 78%; --y: 10%; --size: 80px;  --time: 4s; --delay: -2s; --drift: 10px;"><img src="assets/lemon.svg" alt=""></li>
      <li style="--x: 88%; --y: 52%; --size: 100px; --time: 8s; --delay: -5s; --drift: 18px;"><img src="assets/leaf.svg" alt=""></li>
      <li style="--x: 4%;  --y: 58%; --size: 84px;  --time: 4s; --delay: -3s; --drift: 12px;"><img src="assets/pepper.svg" alt=""></li>
      <li style="--x: 22%; --y: 80%; --size: 70px;  --time: 8s; --delay: -6s; --drift: 14px;"><img src="assets/orange.svg" alt=""></li>
      <li style="--x: 68%; --y: 78%; --size: 76px;  --time: 4s; --delay: -1s; --drift: 10px;"><img src="assets/berry.svg" alt=""></li>
    </ul>

    <div class="hero-text">
      <p class="eyebrow">Demo Co.</p>
      <h1>Fresh picks,<br>delivered weekly</h1>
      <p class="lede">A small demo of floating images built with plain CSS. No libraries, no JavaScript needed for the motion.</p>
      <a class="button" href="#">Shop now</a>
    </div>

    <button class="pause" type="button" aria-pressed="false">Pause animation</button>
  </header>

  <script src="script.js"></script>
</body>
</html>
