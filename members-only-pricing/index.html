<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members-only pricing demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>Members-only pricing</h1>
  <p class="lede">Prices stay hidden until a buyer is approved. Use the switch to see both views. The products and prices here are made up.</p>

  <label class="switch">
    <input type="checkbox" id="approved">
    <span>Signed in as an approved buyer</span>
  </label>

  <ul class="grid" id="grid"></ul>
</main>
<script src="script.js"></script>
</body>
</html>
