<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scroll reveal text | Web snippets</title>
  <meta name="description" content="Lines of text that fade in one after another as a section scrolls into view, using IntersectionObserver.">
  <meta name="author" content="Cordell Phillip">
  <link rel="canonical" href="https://cordellphillip.github.io/web-snippets/scroll-reveal-text/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Scroll reveal text | Web snippets">
  <meta property="og:description" content="Lines of text that fade in one after another as a section scrolls into view, using IntersectionObserver.">
  <meta property="og:url" content="https://cordellphillip.github.io/web-snippets/scroll-reveal-text/">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="spacer">
  <h1>Scroll down</h1>
  <p>The list below appears one line at a time.</p>
</header>

<section class="panel" id="panel">
  <h2 class="reveal">Who we serve</h2>
  <p class="reveal">A short line that explains the section.</p>
  <ul class="rows">
    <li class="reveal">Neighborhood businesses</li>
    <li class="reveal">Schools and daycares</li>
    <li class="reveal">Community programs</li>
    <li class="reveal">And more</li>
  </ul>
</section>

<footer class="spacer"><p>That's it.</p></footer>
<script src="script.js"></script>
</body>
</html>
